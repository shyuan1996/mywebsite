<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>祥鉞｜設計審閱預覽</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #dce0d4;
        color: #173c35;
        font:
          13px system-ui,
          sans-serif;
      }
      header {
        padding: 15px 22px;
        background: #173c35;
        color: #f2f1e9;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      header strong {
        font-size: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        padding: 8px;
        color: #173c35;
        background: #f2f1e9;
        border: 0;
        font: inherit;
      }
      a {
        color: inherit;
        margin-left: auto;
      }
      main {
        display: flex;
        justify-content: center;
        padding: 24px;
        min-height: calc(100dvh - 72px);
      }
      iframe {
        width: 100%;
        height: calc(100dvh - 120px);
        border: 0;
        background: #f2f1e9;
        box-shadow: 0 10px 35px #173c3526;
      }
      p {
        margin: 0;
        font-size: 11px;
        opacity: 0.8;
      }
      iframe.mobile {
        width: 406px;
        height: 860px;
        max-width: 100%;
        border: 8px solid #173c35;
        border-radius: 30px;
      }
      iframe.small {
        width: 336px;
        height: 766px;
        max-width: 100%;
        border: 8px solid #173c35;
        border-radius: 26px;
      }
      iframe.tablet {
        width: 784px;
        height: 1040px;
        max-width: 100%;
        border: 8px solid #173c35;
        border-radius: 20px;
      }
      @media (max-width: 600px) {
        main {
          padding: 12px;
        }
        header {
          gap: 12px;
        }
        a {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>SHYUAN / 設計審閱</strong>
        <p>尚未上線 · 預覽表單不會送出</p>
      </div>
      <label
        >頁面<select id="page">
          <option value="index.html">首頁</option>
          <option value="about.html">關於祥鉞</option>
          <option value="services.html">服務項目</option>
          <option value="portfolio.html">精選作品</option>
          <option value="contact.html">聯絡我們</option>
        </select></label
      ><label
        >尺寸<select id="size">
          <option value="desktop">桌面</option>
          <option value="mobile">手機 390px</option>
          <option value="small">小手機 320px</option>
          <option value="tablet">平板 768px</option>
        </select></label
      ><a id="direct" href="index.html" target="_blank" rel="noopener"
        >開啟完整頁面 ↗</a
      >
    </header>
    <main>
      <iframe id="preview" src="index.html" title="祥鉞新版網站預覽"></iframe>
    </main>
    <script>
      const page = document.querySelector("#page"),
        size = document.querySelector("#size"),
        preview = document.querySelector("#preview");
      page.addEventListener("change", () => {
        preview.src = page.value;
        document.querySelector("#direct").href = page.value;
      });
      size.addEventListener("change", () => {
        preview.className = size.value;
      });
      const params = new URLSearchParams(location.search);
      if ([...size.options].some((o) => o.value === params.get("size"))) {
        size.value = params.get("size");
        preview.className = size.value;
      }
      if ([...page.options].some((o) => o.value === params.get("page"))) {
        page.value = params.get("page");
        preview.src = page.value;
        document.querySelector("#direct").href = page.value;
      }
    </script>
  </body>
</html>
